<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="barg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#101a33"/>
      <stop offset="1" stop-color="#1b1030"/>
    </linearGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00f0ff"/>
      <stop offset="1" stop-color="#ff2bd6"/>
    </linearGradient>
    <filter id="glow" x="-10%" y="-50%" width="120%" height="200%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- typing reveal clips: 12s loop, one line every ~1.7s -->
    <clipPath id="c1"><rect x="20" y="62" width="0" height="30">
      <animate attributeName="width" values="0;0;860;860;0" keyTimes="0;0.0417;0.1583;0.93;1" dur="12s" repeatCount="indefinite"/>
    </rect></clipPath>
    <clipPath id="c2"><rect x="20" y="102" width="0" height="30">
      <animate attributeName="width" values="0;0;860;860;0" keyTimes="0;0.1833;0.3;0.93;1" dur="12s" repeatCount="indefinite"/>
    </rect></clipPath>
    <clipPath id="c3"><rect x="20" y="142" width="0" height="30">
      <animate attributeName="width" values="0;0;860;860;0" keyTimes="0;0.325;0.4417;0.93;1" dur="12s" repeatCount="indefinite"/>
    </rect></clipPath>
    <clipPath id="c4"><rect x="20" y="182" width="0" height="30">
      <animate attributeName="width" values="0;0;860;860;0" keyTimes="0;0.4667;0.5833;0.93;1" dur="12s" repeatCount="indefinite"/>
    </rect></clipPath>
    <clipPath id="c5"><rect x="20" y="222" width="0" height="30">
      <animate attributeName="width" values="0;0;860;860;0" keyTimes="0;0.6083;0.725;0.93;1" dur="12s" repeatCount="indefinite"/>
    </rect></clipPath>
  </defs>

  <!-- window -->
  <rect x="2" y="2" width="896" height="326" rx="14" fill="#0a0e17" stroke="url(#frame)" stroke-width="2"/>
  <path d="M2 16a14 14 0 0 1 14-14h868a14 14 0 0 1 14 14v22H2z" fill="url(#barg)"/>
  <circle cx="26" cy="20" r="6" fill="#ff5f56"/>
  <circle cx="48" cy="20" r="6" fill="#ffbd2e"/>
  <circle cx="70" cy="20" r="6" fill="#27c93f"/>
  <text x="450" y="25" text-anchor="middle" font-family="'Courier New',Courier,monospace" font-size="14" fill="#8b949e">aelxkv@neon-city: ~</text>

  <g font-family="'Courier New',Courier,monospace" font-size="18" filter="url(#glow)">
    <g clip-path="url(#c1)">
      <text x="24" y="84"><tspan fill="#ff2bd6">$</tspan><tspan fill="#00f0ff"> whoami</tspan><tspan fill="#8b949e">  &#8594;  </tspan><tspan fill="#e6edf3">alex | CS student | aspiring SOC analyst</tspan></text>
    </g>
    <g clip-path="url(#c2)">
      <text x="24" y="124"><tspan fill="#ff2bd6">$</tspan><tspan fill="#00f0ff"> cat focus.txt</tspan><tspan fill="#8b949e">  &#8594;  </tspan><tspan fill="#e6edf3">cybersecurity | blue team | linux</tspan></text>
    </g>
    <g clip-path="url(#c3)">
      <text x="24" y="164"><tspan fill="#ff2bd6">$</tspan><tspan fill="#00f0ff"> ls ./stack</tspan><tspan fill="#8b949e">  &#8594;  </tspan><tspan fill="#e6edf3">C  Java  Python  Bash  Pawn  JavaScript</tspan></text>
    </g>
    <g clip-path="url(#c4)">
      <text x="24" y="204"><tspan fill="#ff2bd6">$</tspan><tspan fill="#00f0ff"> uptime --coding</tspan><tspan fill="#8b949e">  &#8594;  </tspan><tspan fill="#e6edf3">daily, mostly from an Android phone</tspan></text>
    </g>
    <g clip-path="url(#c5)">
      <text x="24" y="244"><tspan fill="#ff2bd6">$</tspan><tspan fill="#00f0ff"> status</tspan><tspan fill="#8b949e">  &#8594;  </tspan><tspan fill="#00ff9c">open to internships and collabs</tspan></text>
    </g>

    <!-- prompt + blinking cursor -->
    <text x="24" y="288" fill="#ff2bd6">$</text>
    <rect x="46" y="272" width="11" height="20" fill="#00f0ff">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
