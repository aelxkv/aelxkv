<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="310" viewBox="0 0 900 310" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <!-- typing reveal clips: 14s loop -->
    <clipPath id="c1"><rect x="20" y="58" width="0" height="30">
      <animate attributeName="width" values="0;0;860;860;0" keyTimes="0;0.0429;0.1571;0.95;1" dur="14s" repeatCount="indefinite"/>
    </rect></clipPath>
    <clipPath id="c2"><rect x="20" y="98" width="0" height="30">
      <animate attributeName="width" values="0;0;860;860;0" keyTimes="0;0.2071;0.3214;0.95;1" dur="14s" repeatCount="indefinite"/>
    </rect></clipPath>
    <clipPath id="c3"><rect x="20" y="138" width="0" height="30">
      <animate attributeName="width" values="0;0;860;860;0" keyTimes="0;0.3714;0.4857;0.95;1" dur="14s" repeatCount="indefinite"/>
    </rect></clipPath>
    <clipPath id="c4"><rect x="20" y="178" width="0" height="30">
      <animate attributeName="width" values="0;0;860;860;0" keyTimes="0;0.5357;0.65;0.95;1" dur="14s" repeatCount="indefinite"/>
    </rect></clipPath>
    <clipPath id="c5"><rect x="20" y="218" width="0" height="30">
      <animate attributeName="width" values="0;0;860;860;0" keyTimes="0;0.7;0.8143;0.95;1" dur="14s" repeatCount="indefinite"/>
    </rect></clipPath>
  </defs>

  <!-- window -->
  <rect x="1" y="1" width="898" height="308" rx="10" fill="#1d2021" stroke="#504945" stroke-width="2"/>
  <path d="M1 11a10 10 0 0 1 10-10h878a10 10 0 0 1 10 10v26H1z" fill="#3c3836"/>
  <circle cx="24" cy="19" r="6" fill="#cc241d"/>
  <circle cx="46" cy="19" r="6" fill="#d79921"/>
  <circle cx="68" cy="19" r="6" fill="#98971a"/>
  <text x="450" y="24" text-anchor="middle" font-family="'Courier New',Courier,monospace" font-size="14" fill="#a89984">alex@termux: ~</text>

  <g font-family="'Courier New',Courier,monospace" font-size="18">
    <g clip-path="url(#c1)">
      <text x="24" y="80"><tspan fill="#b8bb26">$</tspan><tspan fill="#fabd2f"> whoami</tspan><tspan fill="#928374">   </tspan><tspan fill="#ebdbb2">alex</tspan></text>
    </g>
    <g clip-path="url(#c2)">
      <text x="24" y="120"><tspan fill="#b8bb26">$</tspan><tspan fill="#fabd2f"> cat about.txt</tspan><tspan fill="#928374">   </tspan><tspan fill="#ebdbb2">cs student from kerala, into security and systems</tspan></text>
    </g>
    <g clip-path="url(#c3)">
      <text x="24" y="160"><tspan fill="#b8bb26">$</tspan><tspan fill="#fabd2f"> ls projects/</tspan><tspan fill="#928374">   </tspan><tspan fill="#83a598">neon-city  xp-bot  dsa-in-c  safe-share</tspan></text>
    </g>
    <g clip-path="url(#c4)">
      <text x="24" y="200"><tspan fill="#b8bb26">$</tspan><tspan fill="#fabd2f"> uptime</tspan><tspan fill="#928374">   </tspan><tspan fill="#ebdbb2">coding mostly on my phone</tspan></text>
    </g>
    <g clip-path="url(#c5)">
      <text x="24" y="240"><tspan fill="#b8bb26">$</tspan><tspan fill="#fabd2f"> cat status.txt</tspan><tspan fill="#928374">   </tspan><tspan fill="#b8bb26">open to internships</tspan></text>
    </g>

    <text x="24" y="282" fill="#b8bb26">$</text>
    <rect x="44" y="267" width="10" height="18" fill="#ebdbb2">
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.5;0.5;0.95;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
