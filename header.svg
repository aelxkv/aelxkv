<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="200" viewBox="0 0 1000 200" xmlns:c2pa="http://c2pa.org/manifest">
  <rect x="1" y="1" width="998" height="198" rx="10" fill="#282828" stroke="#504945" stroke-width="2"/>

  <!-- name with blinking underscore -->
  <text x="48" y="96" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="58" font-weight="700" fill="#ebdbb2">Alex K V<tspan fill="#fabd2f">_<animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.5;0.5;0.95;1" dur="1.1s" repeatCount="indefinite"/></tspan></text>

  <!-- underline draws itself on load -->
  <rect x="50" y="112" width="0" height="4" rx="2" fill="#d79921">
    <animate attributeName="width" from="0" to="130" dur="1.2s" fill="freeze"/>
  </rect>

  <!-- rotating tagline (3 slots, 9s loop) -->
  <g font-family="'Courier New',Courier,monospace" font-size="22" fill="#a89984">
    <text x="50" y="156">cybersecurity student, learning blue team
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.30;0.34;0.97;1" dur="9s" repeatCount="indefinite"/>
    </text>
    <text x="50" y="156" opacity="0">i build discord bots and game servers
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.33;0.37;0.63;0.67;1" dur="9s" repeatCount="indefinite"/>
    </text>
    <text x="50" y="156" opacity="0">android + termux is my dev setup
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.66;0.70;0.97;1" dur="9s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- status, top right -->
  <circle cx="728" cy="46" r="6" fill="#b8bb26">
    <animate attributeName="opacity" values="1;0.35;1" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <text x="952" y="52" text-anchor="end" font-family="'Courier New',Courier,monospace" font-size="18" fill="#ebdbb2">open to internships</text>

  <!-- location, bottom right -->
  <text x="952" y="172" text-anchor="end" font-family="'Courier New',Courier,monospace" font-size="16" fill="#928374">Kerala, India</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
