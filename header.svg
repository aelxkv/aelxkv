<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="280" viewBox="0 0 1000 280" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050816"/>
      <stop offset="0.55" stop-color="#0b1030"/>
      <stop offset="1" stop-color="#1a0b2e"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00f0ff"/>
      <stop offset="0.5" stop-color="#7a5cff"/>
      <stop offset="1" stop-color="#ff2bd6"/>
    </linearGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00f0ff"/>
      <stop offset="1" stop-color="#ff2bd6"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#00f0ff" stroke-opacity="0.10" stroke-width="1"/>
      <animateTransform attributeName="patternTransform" type="translate" from="0 0" to="40 40" dur="6s" repeatCount="indefinite"/>
    </pattern>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="orb" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
    <clipPath id="card">
      <rect x="0" y="0" width="1000" height="280" rx="18"/>
    </clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1000" height="280" fill="url(#bg)"/>
    <rect width="1000" height="280" fill="url(#grid)"/>

    <!-- floating neon orbs -->
    <circle cx="140" cy="60" r="90" fill="#00f0ff" opacity="0.30" filter="url(#orb)">
      <animate attributeName="cx" values="140;360;140" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="60;120;60" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="860" cy="230" r="100" fill="#ff2bd6" opacity="0.28" filter="url(#orb)">
      <animate attributeName="cx" values="860;640;860" dur="11s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="230;150;230" dur="11s" repeatCount="indefinite"/>
    </circle>
    <circle cx="520" cy="20" r="70" fill="#7a5cff" opacity="0.25" filter="url(#orb)">
      <animate attributeName="cx" values="520;700;520" dur="13s" repeatCount="indefinite"/>
    </circle>

    <!-- scanline -->
    <rect x="0" y="-6" width="1000" height="3" fill="#00f0ff" opacity="0.28">
      <animate attributeName="y" from="-6" to="286" dur="5s" repeatCount="indefinite"/>
    </rect>

    <!-- tag line top -->
    <text x="500" y="52" text-anchor="middle" font-family="'Courier New',Courier,monospace" font-size="14" letter-spacing="6" fill="#00f0ff" opacity="0.85">[ SYSTEM ONLINE ]</text>

    <!-- name -->
    <text x="500" y="140" text-anchor="middle" font-family="'Segoe UI',Arial,Helvetica,sans-serif" font-size="76" font-weight="800" letter-spacing="10" fill="url(#title)" filter="url(#glow)">ALEX K V</text>

    <!-- subtitle -->
    <text x="500" y="188" text-anchor="middle" font-family="'Courier New',Courier,monospace" font-size="20" letter-spacing="5" fill="#9fb4ff">CYBERSECURITY  //  SYSTEMS  //  BOTS</text>

    <!-- handle + status -->
    <text x="500" y="234" text-anchor="middle" font-family="'Courier New',Courier,monospace" font-size="16" letter-spacing="2" fill="#c9d1d9">@aelxkv   |   <tspan fill="#00ff9c">&#9679; open to internships</tspan></text>
  </g>

  <!-- corner brackets -->
  <g fill="none" stroke="#00f0ff" stroke-width="3" stroke-linecap="round">
    <path d="M18 52V28a10 10 0 0 1 10-10h24"/>
    <path d="M982 52V28a10 10 0 0 0-10-10h-24"/>
    <path d="M18 228v24a10 10 0 0 0 10 10h24"/>
    <path d="M982 228v24a10 10 0 0 1-10 10h-24"/>
  </g>

  <!-- frame -->
  <rect x="1" y="1" width="998" height="278" rx="18" fill="none" stroke="url(#frame)" stroke-opacity="0.55" stroke-width="2"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
